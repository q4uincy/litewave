[package]
name = "litewave"
version = "0.1.0"
edition = "2021"
description = "A tiny, fast, native music player built with Rust and egui"
license = "MIT"
readme = "README.md"

[dependencies]
eframe = "0.29"
rodio = { version = "0.19", default-features = false, features = ["symphonia-all"] }
lofty = "0.21"
walkdir = "2"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
