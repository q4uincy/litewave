[package]
name = "litewave"
version = "0.2.0"
edition = "2021"
description = "A tiny, fast, native music player with an iPod mode and optional Spotify support"
license = "MIT"
readme = "README.md"

[features]
default = []
# Spotify library browsing + built-in playback (unofficial librespot backend).
spotify = [
    "dep:librespot",
    "dep:tokio",
    "dep:ureq",
    "dep:sha2",
    "dep:base64",
    "dep:rand",
    "dep:webbrowser",
    "dep:urlencoding",
]

[dependencies]
eframe = "0.29"
rodio = { version = "0.19", default-features = false, features = ["symphonia-all"] }
lofty = "0.21"
walkdir = "2"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"

librespot = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"], optional = true }
ureq = { version = "2", features = ["json"], optional = true }
sha2 = { version = "0.10", optional = true }
base64 = { version = "0.22", optional = true }
rand = { version = "0.8", optional = true }
webbrowser = { version = "1", optional = true }
urlencoding = { version = "2", optional = true }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
