[package]
name = "litewave"
version = "0.6.0"
edition = "2021"
description = "A tiny, fast, native music player with an iPod mode and optional Spotify support"
license = "MIT"
readme = "README.md"

[features]
default = []
# Media keys (play / pause / next / previous) and the system media overlay.
mediakeys = ["dep:souvlaki", "dep:raw-window-handle"]
# Spotify library browsing + built-in playback (unofficial librespot backend).
spotify = [
    "dep:librespot",
    "dep:tokio",
    "dep:sha2",
    "dep:base64",
    "dep:rand",
    "dep:webbrowser",
    "dep:urlencoding",
    "dep:vergen",
    "dep:log",
]

[dependencies]
# glow (OpenGL) is tried first; wgpu (DirectX/Vulkan) is the fallback when OpenGL is missing.
eframe = { version = "0.29", features = ["wgpu"] }
rodio = { version = "0.19", default-features = false, features = ["symphonia-all"] }
lofty = "0.21"
walkdir = "2"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
# HTTP for lyrics (LRCLIB). Also used by the optional Spotify feature.
ureq = { version = "2", features = ["json"] }

souvlaki = { version = "0.7", optional = true, default-features = false, features = ["use_zbus"] }
raw-window-handle = { version = "0.6", optional = true }
librespot = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"], optional = true }
sha2 = { version = "0.10", optional = true }
base64 = { version = "0.22", optional = true }
rand = { version = "0.8", optional = true }
webbrowser = { version = "1", optional = true }
urlencoding = { version = "2", optional = true }
# Pin for librespot-core 0.8.0: its build script pulls vergen-gitcl 1.0.x, which needs vergen-lib 0.1.x,
# but a fresh dependency resolve picks vergen 9.1.0 (vergen-lib 9.x) and the build script fails to compile.
vergen = { version = "=9.0.6", optional = true }
log = { version = "0.4", optional = true }

# Spotify sign-in tokens are kept in Windows Credential Manager.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

# Embeds assets/icon.ico into litewave.exe so the file itself shows the logo in Explorer.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
