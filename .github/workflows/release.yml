name: Release

# Tag a version to build the downloads:  git tag v0.6.0 && git push origin v0.6.0
# Windows and Linux only for now. macOS needs a signed app, so Mac users build from source.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: litewave-windows-x64.zip
          - os: ubuntu-latest
            asset: litewave-linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build (Windows, static runtime)
        if: runner.os == 'Windows'
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --features spotify,mediakeys
      - name: Build
        if: runner.os != 'Windows'
        run: cargo build --release --features spotify,mediakeys
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target\release\litewave.exe,README.md,LICENSE -DestinationPath ${{ matrix.asset }}
      - name: Package (Linux)
        if: runner.os != 'Windows'
        run: |
          cp target/release/litewave .
          tar -czf ${{ matrix.asset }} litewave README.md LICENSE
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
          generate_release_notes: true
