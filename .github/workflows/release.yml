name: Release

# Tag a version to build the downloads:  git tag v0.6.0 && git push origin v0.6.0
# Windows and Linux only for now. macOS needs a signed app, so Mac users build from source.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: litewave-windows-x64.zip
          - os: ubuntu-latest
            asset: litewave-linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the whole history, so the notes can list the commits since the last tag
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libssl-dev
      - name: Use the tag as the app version (so the in-app update check works)
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "0,/^version = \".*\"/s//version = \"$VERSION\"/" Cargo.toml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build (Windows, static runtime)
        if: runner.os == 'Windows'
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --features spotify,mediakeys
      - name: Build
        if: runner.os != 'Windows'
        run: cargo build --release --features spotify,mediakeys
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target\release\litewave.exe,README.md,LICENSE -DestinationPath ${{ matrix.asset }}
      - name: Package (Linux)
        if: runner.os != 'Windows'
        run: |
          cp target/release/litewave .
          tar -czf ${{ matrix.asset }} litewave README.md LICENSE
      - name: Build installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          iscc /DAppVersion=$version installer\litewave-setup.iss
      - name: Write the release notes (RELEASE_NOTES.md if it has text, else the commit messages)
        shell: bash
        run: |
          if [ -s RELEASE_NOTES.md ]; then
            cp RELEASE_NOTES.md release-notes.md
          else
            PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
            {
              echo "## What's new"
              if [ -n "$PREV" ]; then
                git log "$PREV..${GITHUB_REF_NAME}" --no-merges --pretty='- %s'
              else
                git log -20 --no-merges --pretty='- %s'
              fi
            } > release-notes.md
          fi
          cat release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset }}
            dist/litewave-setup.exe
          body_path: release-notes.md
